# Confidential backend-only client used by ms-ai-server to exchange a
# validated user access token for a short-lived token scoped to Knowledge MCP.
# The generated client secret belongs in ms-ai-server secret management as
# MCP_KEYCLOAK_TOKEN_EXCHANGE_CLIENT_SECRET.
CLIENT_TYPE="token-exchange"
CLIENT_ID="ms-ai-server-mcp-exchange"
AUDIENCE="ms-ai-server-mcp-exchange"
AUDIENCES="ms-mcp-server-ouros-knowledge"
