# First-party Android client.
# One interactive login issues a single access token accepted by the three
# mobile-facing APIs plus the confidential exchange requester. The mobile token
# is never valid directly at Knowledge MCP. Refresh tokens stay with Keycloak.
CLIENT_TYPE="mobile"
CLIENT_ID="ouros-mobile"
REDIRECT_URIS="com.ourosapp.ourosandroidapp:/oauth2redirect|http://127.0.0.1:8765/callback"
AUDIENCES="ms-spring-api|ms-ai-server|ms-telemetry-dashboard-service|ms-ai-server-mcp-exchange"
