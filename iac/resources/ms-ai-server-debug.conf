# Confidential client used only by the ms-ai-server developer Debug Console.
# Direct Access Grant is intentionally isolated here; mobile/web must use
# Authorization Code + PKCE and the realm browser flow (including email OTP).
# Store the Keycloak-generated client secret as
# DEBUG_UI_KEYCLOAK_CLIENT_SECRET in ms-ai-server secret management.
CLIENT_TYPE="password-grant"
CLIENT_ID="ms-ai-server-debug"
AUDIENCES="ms-ai-server"
